# caisse: shared Stripe adapter for the Facile Suite.
ignore: [.git, node_modules, vendor, dist, build, target, testdata, .output, _app, coverage]
extensions: [.go]

disabled:
  - gen.line.long   # gofmt owns line width

limits:
  structFields: 13   # Payment mirrors Stripe's wire shape; splitting it would break the public API

failOn: error
